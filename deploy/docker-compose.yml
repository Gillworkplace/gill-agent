name: gill
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gill
      POSTGRES_USER: gill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gillpass}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gill"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gilladmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gillminio123}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 6; mc alias set g http://minio:9000 gilladmin ${MINIO_ROOT_PASSWORD:-gillminio123} && mc mb -p g/gill-files; exit 0"
  agentd:
    build:
      context: ../agent
      dockerfile: agentd/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-?必填}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4-flash}
      - GILL_SANDBOX=remote
      # 沙箱机通路：经宿主机 SSH 隧道（host.docker.internal）或直连（39.107.34.109）
      - CUBE_API_URL=${CUBE_API_URL:-http://host.docker.internal:13000}
      - CUBE_PROXY_NODE_IP=${CUBE_PROXY_NODE_IP:-host.docker.internal}
      - CUBE_PUBLIC_HOST=host.docker.internal
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=gilladmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-gillminio123}
      - DATABASE_URL_DSN=postgresql://gill:${POSTGRES_PASSWORD:-gillpass123}@postgres:5432/gill
      - CUBE_TEMPLATE_ID=${CUBE_TEMPLATE_ID:-tpl-4264d9c2e5d6432e8a55cf4e}
      - E2B_API_KEY=${E2B_API_KEY:-e2b_00000000000000000000000000000}
      - HTTP_PROXY=${HTTP_PROXY:-http://host.docker.internal:7890}
      - NO_PROXY=localhost,127.0.0.1,postgres,redis,minio,agentd,web,host.docker.internal,39.107.34.109,.cube.app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: {condition: service_started}
  web:
    build: ../web
    ports: ["8080:8080"]
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/gill
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gillpass}
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-please-change-32b!}
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-}
      - AGENTD_URL=http://agentd:8000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=gilladmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-gillminio123}
      - HTTP_PROXY=${HTTP_PROXY:-http://host.docker.internal:7890}
      - NO_PROXY=localhost,127.0.0.1,postgres,redis,minio,agentd,web,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: {condition: service_healthy}
      agentd: {condition: service_started}
volumes:
  pgdata:
  miniodata:
