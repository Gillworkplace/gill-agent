<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gill Agent — 协作开发工作台</title>
<style>
:root{--bg1:#fff;--bg2:#f7f8fa;--bg3:#eff1f4;--text1:#171a1f;--text2:#5c6470;--accent:#2f6bff;--ok:#22a06b;--warn:#f5a623;--err:#e5484d;--border:#e3e6ea;--radius:10px;--mono:ui-monospace,Consolas,monospace}
[data-theme=dark]{--bg1:#0f1115;--bg2:#16181d;--bg3:#1e2128;--text1:#e8eaed;--text2:#9aa3af;--border:#2a2e36;--accent:#4d82ff}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg2);color:var(--text1);height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;font:inherit}
/* 登录页 */
#login{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg2)}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:32px;width:360px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.card h1{font-size:20px;margin-bottom:4px}.card p{color:var(--text2);font-size:13px;margin-bottom:20px}
.field{margin-bottom:12px}.field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg1);color:var(--text1);font-size:14px}
.field input:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;margin-top:6px}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.err{color:var(--err);font-size:13px;margin-top:8px;min-height:16px}
/* 工作台布局 */
#app{display:none;flex:1;overflow:hidden}
#app.on{display:flex}
aside{width:260px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column}
aside .top{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}
aside .new{font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:none;color:var(--accent)}
#sessions{flex:1;overflow:auto;padding:8px}
.sess{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.sess:hover{background:var(--bg2)}.sess.on{background:var(--bg3)}
.sess .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
aside .bottom{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#stream{flex:1;overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg1);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.ai code{font-family:var(--mono);font-size:13px;background:var(--bg3);padding:1px 5px;border-radius:4px}
.msg.sys{align-self:center;color:var(--text2);font-size:12px}
.tool{align-self:flex-start;font-family:var(--mono);font-size:12px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:6px 10px;max-width:78%}
.tool b{color:var(--accent)}
#inputbar{padding:14px 32px;border-top:1px solid var(--border);background:var(--bg1);display:flex;gap:10px}
#input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text1);resize:none;font:inherit;max-height:140px}
#send{padding:0 22px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
#send.stop{background:var(--err)}
#term{height:180px;border-top:1px solid var(--border);background:#0c0e12;color:#9fe8b5;font-family:var(--mono);font-size:12px;padding:10px 16px;overflow:auto;white-space:pre-wrap;display:none}
#term.on{display:block}
#fpanel{display:none;position:fixed;right:16px;top:16px;bottom:16px;width:400px;background:var(--bg1);border:1px solid var(--border);border-radius:12px;flex-direction:column;z-index:55;box-shadow:0 10px 40px rgba(0,0,0,.15)}
#fpanel.on{display:flex}
#fpanel .bar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:13px}
#flist{flex:1;overflow:auto;padding:10px}
.frow{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px}
.frow:hover{background:var(--bg2)}
.frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sz{color:var(--text2);font-size:12px}
.frow button{border:1px solid var(--border);background:none;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--text2)}
.hint2{font-size:12px;color:var(--text2);text-align:center;padding:20px}
#kb{display:none;position:fixed;inset:0;background:var(--bg1);z-index:60;flex-direction:column}
#kb.on{display:flex}
#kb .bar{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}
#kb .bar h2{font-size:16px;flex:1}
#kb .bar input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text1);width:260px;font:inherit}
#kblist{flex:1;overflow:auto;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-content:start}
.kbcard{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--bg2)}
.kbcard .t{font-weight:600;font-size:14px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.kbcard .tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg3);color:var(--text2)}
.kbcard .c{font-size:13px;color:var(--text2);line-height:1.5;white-space:pre-wrap}
.kbcard .ops{margin-top:8px;display:flex;gap:8px;font-size:12px;color:var(--text2)}
.kbcard .ops span{cursor:pointer}.kbcard .ops span:hover{color:var(--err)}
#preview{display:none;position:fixed;right:16px;top:16px;bottom:210px;width:440px;background:var(--bg1);border:1px solid var(--border);border-radius:12px;flex-direction:column;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.15)}
#preview.on{display:flex}
#preview .bar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2)}
#preview .bar b{color:var(--text1);font-size:13px}
#preview .bar .sp{flex:1}
#preview .bar button{border:1px solid var(--border);background:none;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--text2)}
#pcv{flex:1;width:100%;cursor:crosshair;background:#000}
#purl{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg2);color:var(--text1)}
#banner{display:none;background:var(--warn);color:#fff;text-align:center;padding:6px;font-size:13px}
#banner.on{display:block}
.appr{align-self:flex-start;max-width:78%;border:1px solid var(--warn);border-radius:12px;padding:12px 14px;background:var(--bg1)}
.appr .cmd{font-family:var(--mono);font-size:13px;background:var(--bg3);padding:6px 10px;border-radius:6px;margin:8px 0;word-break:break-all}
.appr .risk{font-size:11px;padding:1px 8px;border-radius:4px;color:#fff}
.appr .risk.high{background:var(--err)}.appr .risk.medium{background:var(--warn)}
.appr .btns{display:flex;gap:8px}.appr .btns button{padding:6px 16px;border:none;border-radius:8px;font-size:13px}
.appr .btns .y{background:var(--ok);color:#fff}.appr .btns .n{background:var(--bg3);color:var(--text2)}.appr .btns .a{background:var(--bg3);color:var(--accent);border:1px solid var(--accent)}
.appr .cnt{font-size:11px;color:var(--text2);margin-left:auto;align-self:center}
#modebar{position:fixed;bottom:8px;left:270px;z-index:40;font-size:12px;color:var(--text2);display:flex;gap:6px;align-items:center}
#modebar button{border:1px solid var(--border);background:var(--bg1);border-radius:6px;padding:2px 10px;font-size:12px;color:var(--text2)}
#modebar button.on{color:#fff;background:var(--accent);border-color:var(--accent)}
#chat{display:none;position:fixed;left:276px;bottom:196px;width:320px;height:240px;background:var(--bg1);border:1px solid var(--border);border-radius:12px;flex-direction:column;z-index:45}
#chat.on{display:flex}
#chat .bar{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;align-items:center}
#chatmsgs{flex:1;overflow:auto;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
#chatmsgs .m b{color:var(--accent)}
#chat .inp{display:flex;border-top:1px solid var(--border)}
#chat .inp input{flex:1;border:none;background:var(--bg2);color:var(--text1);padding:8px 12px;font:inherit;font-size:13px;border-radius:0 0 0 12px}
#chat .inp button{border:none;background:var(--accent);color:#fff;padding:0 14px;border-radius:0 0 12px 0}
.hint{align-self:center;font-size:12px;color:var(--text2);margin-top:auto}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
</head>
<body>
<div id="banner">连接中断，正在重连…</div>

<div id="login">
  <div class="card">
    <h1>Gill Agent</h1><p>协作开发工作台 · 私有部署</p>
    <div class="field"><input id="lu" placeholder="用户名（3-32 位字母数字）"></div>
    <div class="field"><input id="lp" type="password" placeholder="密码（≥8 位，含字母数字）"></div>
    <button class="btn" onclick="doLogin()">登录</button>
    <button class="btn ghost" onclick="doRegister()">注册新账号</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="top"><select id="spaceSel" onchange="switchSpace(this.value)" style="max-width:120px;font:inherit;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text1);padding:2px"></select>
  <button class="new" onclick="newSession()">＋</button></div>
<div style="padding:4px 12px;border-bottom:1px solid var(--border);font-size:11px"><a href="javascript:void(0)" onclick="spaceMgr()" style="color:var(--text2)">空间管理 / 邀请成员</a></div>
    <div id="sessions"></div>
    <div class="bottom"><span id="whoami"></span><button class="new" onclick="togglePreview()">🌐 预览</button><button class="new" onclick="toggleTheme()">🌗</button><button class="new" onclick="logout()">退出</button></div>
  </aside>
  <main>
    <div id="stream"><div class="hint">选择或新建一个会话开始 · Enter 发送 / Shift+Enter 换行 / Esc 停止 · Ctrl+` 终端</div></div>
    <textarea id="input" rows="1" placeholder="描述任务，例如：写一个爬虫脚本并运行验证…"></textarea>
    <div id="inputbar" style="border-top:none;padding-top:0"><textarea id="input" rows="1" placeholder="描述任务，例如：写一个脚本并在沙箱运行验证…（Enter 发送）"></textarea><button id="send" onclick="sendOrStop()">发送</button></div>
    <div id="term"></div>
  </main>
</div>

<div id="preview">
  <div class="bar"><b>🌐 浏览器预览</b><input id="purl" placeholder="输入网址回车导航"><span class="sp"></span>
    <span id="pfps"></span><button onclick="toggleDemo()">🎬 演示</button><button onclick="opMode()">接力</button><button onclick="wsSend({type:'preview_stop',payload:{}});$('#preview').classList.remove('on')">关闭</button></div>
  <canvas id="pcv"></canvas>
</div>

<div id="chat">
  <div class="bar">💬 成员聊天（@agent 转任务）</div>
  <div id="chatmsgs"></div>
  <div class="inp"><input id="chatin" placeholder="说点什么… / @agent 帮我…"><button onclick="sendChat()">送</button></div>
</div>
<div id="modebar">审批档：<button id="mAuto" class="on" onclick="setMode('auto')">auto 全自动</button><button id="mSug" onclick="setMode('suggest')">suggest 需审批</button></div>
<div id="fpanel">
  <div class="bar"><b>📁 文件</b><span class="sp" style="flex:1"></span>
    <button onclick="pickUpload()">⬆ 上传</button><button onclick="wsSend({type:'file_list',payload:{}})">⟳ 工作区</button>
    <button onclick="$('#fpanel').classList.remove('on')">✕</button></div>
  <div id="flist"><div class="hint2">上传件经 MinIO 直传；「同步」送入沙箱工作区</div></div>
</div>

<div id="sp" style="display:none;position:fixed;inset:0;background:var(--bg1);z-index:60;flex-direction:column">
  <div class="bar" style="padding:14px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center"><h2 style="font-size:16px;flex:1">👥 空间管理</h2><button class="new" onclick="$('#sp').classList.remove('on');$('#sp').style.display='none'">返回</button></div>
  <div style="flex:1;overflow:auto;padding:20px 24px">
    <h3 style="font-size:14px;margin-bottom:8px">创建协作空间</h3>
    <div style="display:flex;gap:8px;margin-bottom:20px"><input id="spName" placeholder="空间名称" style="flex:1;max-width:300px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text1)"><button class="new" onclick="createSpace()">创建</button></div>
    <h3 style="font-size:14px;margin-bottom:8px">邀请成员（用户名直邀）</h3>
    <div style="display:flex;gap:8px;margin-bottom:20px"><input id="invUser" placeholder="对方用户名" style="flex:1;max-width:300px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text1)"><button class="new" onclick="inviteUser()">邀请</button></div>
    <h3 style="font-size:14px;margin-bottom:8px">成员列表</h3><div id="spMembers"></div>
  </div>
</div>

<div id="ex" style="display:none;position:fixed;inset:0;background:var(--bg1);z-index:60;flex-direction:column">
  <div class="bar" style="padding:14px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center"><h2 style="font-size:16px;flex:1">🔌 扩展中心</h2><button class="new" onclick="addExt()">＋ HTTP 工具</button><button class="new" onclick="$('#ex').style.display='none'">返回</button></div>
  <div id="exList" style="flex:1;overflow:auto;padding:20px 24px"></div>
</div>

<div id="adm" style="display:none;position:fixed;inset:0;background:var(--bg1);z-index:60;flex-direction:column">
  <div class="bar" style="padding:14px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center"><h2 style="font-size:16px;flex:1">⚙️ 管理后台</h2><button class="new" onclick="$('#adm').style.display='none'">返回</button></div>
  <div style="flex:1;overflow:auto;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div><h3 style="font-size:14px;margin-bottom:8px">用户</h3><div id="admUsers"></div></div>
    <div><h3 style="font-size:14px;margin-bottom:8px">命令审计（最近）</h3><div id="admAudit" style="font-family:var(--mono);font-size:12px"></div></div>
  </div>
</div>

<div id="kb">
  <div class="bar"><h2>📚 知识库</h2><input id="kbq" placeholder="搜索…" oninput="loadKb(this.value)">
    <button class="new" onclick="addKb()">＋ 添加</button>
    <button class="new" onclick="$('#kb').classList.remove('on')">返回工作台</button></div>
  <div id="kblist"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('gill_token') || '';
let USER = localStorage.getItem('gill_user') || '';
let sessions = [], cur = null, ws = null, wsSid = null, taskRunning = false;
let reconnectAttempts = 0;

/* ---------- 认证 ---------- */
async function api(path, body, method) {
  const r = await fetch('/api/v1' + path, {method: method || (body ? 'POST' : 'GET'),
    headers: {'Content-Type': 'application/json', ...(TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {})},
    body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error?.message || ('HTTP ' + r.status));
  return d;
}
async function doLogin() { try { const d = await api('/auth/login', {username: $('#lu').value, password: $('#lp').value}); TOKEN = d.token; USER = $('#lu').value; localStorage.setItem('gill_token', TOKEN); localStorage.setItem('gill_user', USER); enter(); } catch(e) { $('#lerr').textContent = e.message; } }
async function doRegister() { try { await api('/auth/register', {username: $('#lu').value, password: $('#lp').value}); $('#lerr').textContent = '注册成功，自动登录中…'; doLogin(); } catch(e) { $('#lerr').textContent = e.message; } }
function logout() { localStorage.clear(); TOKEN=''; location.reload(); }

/* ---------- 会话 ---------- */
async function loadSessions() {
  const spaces = await api('/spaces');
  const sid = spaces.find(s => s.type === 'personal')?.id || spaces[0]?.id;
  if (!sid) return;
  sessions = await api('/spaces/' + sid + '/sessions');
  renderSessions();
}
async function newSession() {
  const spaces = await api('/spaces');
  const sid = spaces.find(s => s.type === 'personal')?.id;
  const s = await api('/spaces/' + sid + '/sessions', {title: '新会话 ' + (sessions.length + 1)});
  await loadSpaceSel(); await loadSessions(); openSession(s.id);
}
function renderSessions() {
  $('#sessions').innerHTML = sessions.map(s =>
    `<div class="sess ${s.id === cur ? 'on' : ''}" onclick="openSession('${s.id}')">${s.title || '会话'}<span class="dot"></span></div>`).join('');
}
function openSession(id) { cur = id; renderSessions(); $('#stream').innerHTML = ''; hist(id); connectWs(); }

/* ---------- WS ---------- */
function connectWs() {
  if (ws && wsSid === cur) return;
  if (ws) ws.close();
  wsSid = cur;
  ws = new WebSocket(`ws://${location.host}/ws/agent?sessionId=${cur}&token=${TOKEN}`);
  ws.onopen = () => { $('#banner').classList.remove('on'); reconnectAttempts = 0; };
  ws.onclose = () => { if (cur === wsSid && TOKEN) { $('#banner').classList.add('on'); setTimeout(connectWs, Math.min(30000, 1000 * Math.pow(2, reconnectAttempts++))); } };
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}

/* ---------- 投屏预览（FR-42~46）---------- */
let pvMeta = null, frameCount = 0, frameT0 = 0;
const cv = () => $('#pcv');
function wsSend(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function togglePreview() {
  const p = $('#preview');
  if (p.classList.contains('on')) { p.classList.remove('on'); wsSend({type:'preview_stop',payload:{}}); return; }
  p.classList.add('on'); frameT0 = performance.now(); frameCount = 0;
  wsSend({type:'preview_start', payload:{quality:'mid'}});
}
async function drawFrame(b64) {
  const img = new Image();
  img.src = 'data:image/jpeg;base64,' + b64;
  await img.decode().catch(()=>{});
  const c = cv(); const ctx = c.getContext('2d');
  if (c.width !== img.width) { c.width = img.width; c.height = img.height; }
  ctx.drawImage(img, 0, 0);
  frameCount++;
  const dt = (performance.now() - frameT0) / 1000;
  if (dt > 1) { $('#pfps').textContent = (frameCount / dt).toFixed(1) + ' fps'; frameT0 = performance.now(); frameCount = 0; }
}
cv()?.addEventListener('mousedown', e => {
  const r = e.target.getBoundingClientRect();
  const x = (e.clientX - r.left) * (e.target.width / r.width);
  const y = (e.clientY - r.top) * (e.target.height / r.height);
  wsSend({type:'input_event', payload:{kind:'mouse_click', x, y, button:'left'}});
  setTimeout(() => wsSend({type:'input_event', payload:{kind:'mouse_up', x, y, button:'left'}}), 60);
});
$('#purl')?.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    let u = e.target.value.trim(); if (!/^https?:/.test(u)) u = 'https://' + u;
    wsSend({type:'browser_navigate', payload:{url: u}});
    if (demoMode) wsSend({type:'nav_follow', payload:{url: u}});
  }
});

/* ---------- 操作权 + 成员聊天（FR-135/137）---------- */
let myUid = null;
function opMode() { wsSend({type:'op_lock', payload:{action:'mode', mode: 'relay'}}); sys('已切接力模式（多人协作防误触）'); }
let demoMode = false;
function toggleDemo() {
  demoMode = !demoMode;
  if (demoMode) { $('#preview').classList.add('on'); sys('🎬 演示模式：你的导航将同步给空间内其他成员'); }
  else sys('演示模式已结束');
}
function sendChat() {
  const t = $('#chatin').value.trim(); if (!t) return;
  wsSend({type:'space_chat', payload:{text: t}}); $('#chatin').value = '';
  $('#chatmsgs').insertAdjacentHTML('beforeend', `<div class="m"><b>我</b> ${escapeHtml(t)}</div>`);
  $('#chatmsgs').scrollTop = 1e9;
}
function toggleChat() { $('#chat').classList.toggle('on'); }

/* ---------- 空间切换/管理（FR-131/132）---------- */
let allSpaces = [];
async function loadSpaceSel(sel) {
  allSpaces = await api('/spaces');
  $('#spaceSel').innerHTML = allSpaces.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${x.type === 'personal' ? '🏠' : '👥'} ${escapeHtml(x.name)}</option>`).join('');
}
async function switchSpace(id) { kbSpace = id; curSpaceId = id; await loadSessions(); }
async function spaceMgr() {
  $('#sp').style.display = 'flex';
  const m = await api(`/spaces/${$('#spaceSel').value}/members`);
  $('#spMembers').innerHTML = m.map(x => `<div class="frow"><span class="nm">${escapeHtml(String(x.username))}</span><span class="sz">${x.role}</span></div>`).join('');
}
async function createSpace() {
  const name = $('#spName').value.trim(); if (!name) return;
  const r = await api('/spaces', {name});
  await loadSpaceSel(r.id); await loadSessions(); $('#sp').style.display = 'none';
}
async function inviteUser() {
  const u = $('#invUser').value.trim(); if (!u) return;
  try { await api(`/spaces/${$('#spaceSel').value}/invites`, {username: u}); sys(`已邀请 ${u}`); spaceMgr(); }
  catch (e) { sys('邀请失败：' + e.message); }
}
/* ---------- 扩展中心（FR-106）---------- */
async function openEx() { $('#ex').style.display = 'flex'; loadExts(); }
async function loadExts() {
  const sp = await ensureSpace();
  const list = await api(`/spaces/${sp}/extensions`);
  $('#exList').innerHTML = list.map(x => `<div class="kbcard" style="margin-bottom:10px">
    <div class="t">${escapeHtml(x.name)}<span class="tag">${x.type}</span><span class="tag">${x.status}</span></div>
    <div class="c">HTTP 工具集 · v${x.version}</div>
    <div class="ops"><span>调用 ${x.call_count_7d} 次</span>
      <span style="margin-left:auto" onclick="toggleExt('${x.id}','${x.status === 'enabled' ? 'disabled' : 'enabled'}')">${x.status === 'enabled' ? '停用' : '启用'}</span>
      <span onclick="delExt('${x.id}')">删除</span></div></div>`).join('') || '<div class="hint2">暂无扩展</div>';
}
async function toggleExt(id, status) { await api('/extensions/' + id, {status}, 'PATCH'); loadExts(); }
async function delExt(id) { if (!confirm('删除扩展？')) return; await api('/extensions/' + id, null, 'DELETE'); loadExts(); }
async function addExt() {
  const name = prompt('扩展名（小写字母数字-）'); if (!name) return;
  const url = prompt('工具 URL 模板（如 https://api.corp.com/tickets/{id}）'); if (!url) return;
  const host = new URL(url.replace('{id}', 'x')).hostname;
  const manifest = {tools: [{name: 'call', desc: `调用 ${name} API`, method: 'GET', url, params: {}, network: [host]}]};
  try { await api(`/spaces/${await ensureSpace()}/extensions`, {name, manifest}); loadExts(); }
  catch (e) { alert('创建失败：' + e.message); }
}
/* ---------- 管理后台（FR-7x 简化）---------- */
async function openAdm() {
  const me = await api('/auth/me');
  if (me.role !== 'ADMIN') { sys('仅管理员可用'); return; }
  $('#adm').style.display = 'flex';
  const users = await api('/admin/users');
  $('#admUsers').innerHTML = users.map(u => `<div class="frow"><span class="nm">${escapeHtml(String(u.username))}</span><span class="sz">${u.role}·${u.status}</span>
    <button onclick="admToggle(${u.id},'${u.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE'}')">${u.status === 'ACTIVE' ? '禁用' : '启用'}</button></div>`).join('');
  const audit = await api('/admin/audit?limit=30');
  $('#admAudit').innerHTML = audit.map(a => `<div style="padding:4px 0;border-bottom:1px solid var(--border)">${escapeHtml(String(a.command || '')).slice(0, 60)} <span style="color:var(--text2)">exit=${a.exit_code}</span></div>`).join('');
}
async function admToggle(id, status) { await api('/admin/users/' + id, {status}, 'PATCH'); openAdm(); }

/* ---------- 知识库页（FR-97）---------- */
let kbSpace = null;
async function openKb() {
  $('#kb').classList.add('on');
  if (!kbSpace) { const spaces = await api('/spaces'); kbSpace = spaces.find(s => s.type === 'personal')?.id; }
  loadKb('');
}
async function loadKb(q) {
  if (!kbSpace) return;
  const items = await api(`/spaces/${kbSpace}/knowledge${q ? '?q=' + encodeURIComponent(q) : ''}`);
  $('#kblist').innerHTML = items.map(i => `
    <div class="kbcard"><div class="t">${escapeHtml(i.title)}
      <span class="tag">${i.type}</span><span class="tag">${i.scope}</span>${i.pinned ? '<span class="tag">📌</span>' : ''}</div>
      <div class="c">${escapeHtml(i.content || '')}</div>
      <div class="ops"><span>命中 ${i.hit_count} 次</span><span>来源 ${i.source === 'explicit' ? '手动' : '对话沉淀'}</span>
        <span style="margin-left:auto" onclick="pinKb('${i.id}',${!i.pinned})">置顶</span>
        <span onclick="delKb('${i.id}')">删除</span></div></div>`).join('') ||
    '<div class="hint" style="margin:40px auto">暂无知识条目 —— 在对话中说"记住 xxx"即可沉淀</div>';
}
async function addKb() {
  const title = prompt('标题'); if (!title) return;
  const content = prompt('内容'); if (!content) return;
  await api(`/spaces/${kbSpace}/knowledge`, {title, content, type: 'fact', scope: 'user'});
  loadKb($('#kbq').value);
}
async function delKb(id) { if (!confirm('删除该条知识？')) return; await api('/knowledge/' + id, null, 'DELETE'); loadKb($('#kbq').value); }
async function pinKb(id, pinned) { await api('/knowledge/' + id, {pinned}, 'PATCH'); loadKb($('#kbq').value); }

/* ---------- 文件面板（FR-61~64）---------- */
let curSpaceId = null, fileKeys = {};
function toggleFiles() {
  const f = $('#fpanel'); f.classList.toggle('on');
  if (f.classList.contains('on')) loadFiles();
}
async function ensureSpace() {
  if (!curSpaceId) { const sp = await api('/spaces'); curSpaceId = sp.find(s => s.type === 'personal')?.id; }
  return curSpaceId;
}
function pickUpload() {
  const inp = document.createElement('input'); inp.type = 'file';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file || !cur) return;
    const r = await api('/files/uploads', {filename: file.name, size: file.size, sessionId: cur});
    fileKeys[r.uploadId] = r.objectKey;
    await fetch(r.url, {method: 'PUT', body: file});
    await api(`/files/uploads/${r.uploadId}/complete`, {});
    sys(`📎 已上传 ${file.name}（${(file.size/1024).toFixed(0)}KB）`);
    loadFiles();
  };
  inp.click();
}
async function loadFiles() {
  const sp = await ensureSpace(); if (!sp) return;
  const items = await api(`/spaces/${sp}/files`);
  $('#flist').innerHTML = items.map(f => `
    <div class="frow"><span class="nm">${escapeHtml(f.filename)}</span><span class="sz">${(f.size_bytes/1024).toFixed(0)}KB·${f.status}</span>
      ${f.direction === 'upload' ? `<button onclick="syncFile('${f.id}','${escapeHtml(f.filename)}')">同步到沙箱</button>` : ''}
      <button onclick="dlFile('${f.id}')">下载</button></div>`).join('') ||
    '<div class="hint2">暂无文件</div>';
}
function syncFile(id, name) {
  if (!cur) { sys('请先选择会话'); return; }
  wsSend({type: 'file_sync_in', payload: {objectKey: fileKeys[id] || '', filename: name}});
  sys(`⏳ 同步 ${name} → 沙箱 /home/user/uploads/`);
}
async function dlFile(id) {
  const r = await api(`/files/${id}/download-url`, {});
  const a = document.createElement('a'); a.href = r.url; a.download = r.filename; a.click();
}

function handle2(env) {
  switch (env.type) {
    case 'file_synced': sys(`✅ 已同步到沙箱：${env.payload.dest}`); break;
    case 'file_exported': sys(`📤 已导出：${env.payload.path}`); break;
    case 'file_tree':
      $('#fpanel').classList.add('on');
      $('#flist').innerHTML = (env.payload.out || '').split('---SIZES---')[0].trim().split('
')
        .filter(Boolean).map(l => `<div class="frow"><span class="nm">${escapeHtml(l)}</span>
          <button onclick="wsSend({type:'file_export',payload:{path:'/home/user/${l}'}})">导出</button></div>`).join('') || '<div class="hint2">工作区为空</div>';
      break;
    case 'approval_request':
      aiBuf = null;
      const a = document.createElement('div'); a.className = 'appr';
      a.innerHTML = `<span class="risk ${p.riskLevel}">${p.riskLevel === 'high' ? '高危' : '中危'}</span>
        <span style="font-size:12px;color:var(--text2)"> ${p.reason || ''}</span>
        <div class="cmd">${escapeHtml(p.command || '')}</div>
        <div class="btns"><button class="y">批准</button><button class="n">拒绝</button><button class="a">本会话总是允许</button>
        <span class="cnt">${p.expiresIn || 120}s</span></div>`;
      const cid = p.cid;
      let left = p.expiresIn || 120;
      const timer = setInterval(() => { left--; const c = a.querySelector('.cnt'); if (c) c.textContent = left + 's';
        if (left <= 0) { clearInterval(timer); a.querySelectorAll('button').forEach(b => b.disabled = true); } }, 1000);
      a.querySelectorAll('button').forEach((b, i) => b.onclick = () => {
        clearInterval(timer); a.querySelectorAll('button').forEach(x => x.disabled = true);
        const action = ['approve', 'deny', 'always_allow'][i];
        wsSend({type: 'approval_response', payload: {cid, action}});
        a.querySelector('.cnt').textContent = action === 'approve' ? '已批准' : action === 'always_allow' ? '本会话免批' : '已拒绝';
      });
      $('#stream').appendChild(a); scroll(); break;
    case 'approval_timeout': sys('审批超时已自动拒绝'); break;
    case 'nav_follow':
      if (!demoMode) { $('#preview').classList.add('on'); $('#purl').value = p.url || ''; sys(`跟随演示导航：${p.url}`); }
      break;
    case 'op_lock_changed': sys(p.holder ? `🔒 接力模式：操作权 → 用户${p.holder}` : (p.mode === 'relay' ? '接力模式：操作权空闲（点「接力」旁按钮申请）' : '已切回自由模式')); break;
    case 'space_chat_msg': $('#chat').classList.add('on');
      $('#chatmsgs').insertAdjacentHTML('beforeend', `<div class="m"><b>用户${p.userId}</b> ${escapeHtml(p.text)}</div>`);
      $('#chatmsgs').scrollTop = 1e9; break;
    case 'kb_captured': sys(`🧠 已记住：${(p.titles || []).join('、')}（查看请点左下 📚）`); break;
    case 'screencast_meta': pvMeta = env.payload; break;
    case 'screencast_frame': drawFrame(env.payload.data); break;
  }
}

/* ---------- 事件渲染 ---------- */
let aiBuf = null;
function addAI() { if (!aiBuf) { aiBuf = document.createElement('div'); aiBuf.className = 'msg ai'; $('#stream').appendChild(aiBuf); } return aiBuf; }
function handle(env) {
  const p = env.payload || {};
  switch (env.type) {
    case 'agent_delta': addAI().textContent += p.content; scroll(); break;
    case 'tool_call':
      aiBuf = null;
      const t = document.createElement('div'); t.className = 'tool';
      t.innerHTML = `<b>▶ ${p.tool}</b> ${escapeHtml(JSON.stringify(p.args || {})).slice(0, 120)}`;
      $('#stream').appendChild(t); scroll(); break;
    case 'tool_result': aiBuf = null; break;
    case 'terminal':
      const term = $('#term'); term.classList.add('on');
      const txt = (p.stream === 'stderr' ? '[31m' : '') + (p.data || '');
      if (xterm) { xterm.write(txt.replace(/
/g, '

')); }
      else { term.textContent += txt; term.scrollTop = term.scrollHeight; }
      break;
    case 'session_status':
      sys(p.status === 'sandbox_creating' ? '沙箱启动中…' : p.status === 'active' ? `沙箱就绪 (${p.sandboxId || ''})` : p.status); break;
    case 'done':
      taskRunning = false; $('#send').textContent = '发送'; $('#send').classList.remove('stop'); aiBuf = null;
      sys(p.status === 'done' ? `任务完成（${p.rounds} 轮 · tokens ${p.tokens?.prompt || 0}+${p.tokens?.completion || 0}）` : `任务${p.status === 'stopped' ? '已停止' : '失败：' + (p.answer || '')}`);
      break;
    case 'approval_request': sys(`⚠ 需要审批（${p.riskLevel}）：${p.command}`); break;
    case 'error': sys('错误：' + (p.message || '')); break;
  }
  handle2(env);
}
function sys(t) { const d = document.createElement('div'); d.className = 'msg sys'; d.textContent = t; $('#stream').appendChild(d); scroll(); }
function scroll() { const s = $('#stream'); s.scrollTop = s.scrollHeight; }
function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function hist(id) {
  try { const msgs = await api(`/sessions/${id}/messages?limit=50`); msgs.reverse().forEach(m => {
    if (m.role === 'user') { const d = document.createElement('div'); d.className = 'msg user'; d.textContent = m.content; $('#stream').appendChild(d); }
    else if (m.role === 'assistant' && m.content) { const d = document.createElement('div'); d.className = 'msg ai'; d.textContent = m.content; $('#stream').appendChild(d); }
  }); scroll(); } catch(e) {}
}

/* ---------- 发送 ---------- */
function sendOrStop() {
  if (taskRunning) { ws?.send(JSON.stringify({type: 'stop', payload: {}})); return; }
  const text = $('#input').value.trim(); if (!text || !cur) return;
  const d = document.createElement('div'); d.className = 'msg user'; d.textContent = text; $('#stream').appendChild(d);
  $('#input').value = ''; scroll();
  taskRunning = true; $('#send').textContent = '停止'; $('#send').classList.add('stop');
  connectWs();
  ws.onopen = () => ws.send(JSON.stringify({type: 'user_input', payload: {text}}));
  if (ws.readyState === 1) ws.send(JSON.stringify({type: 'user_input', payload: {text}}));
}

let approvalMode = 'auto';
function setMode(m) {
  approvalMode = m;
  $('#mAuto').classList.toggle('on', m === 'auto');
  $('#mSug').classList.toggle('on', m === 'suggest');
  wsSend({type: 'set_approval', payload: {value: m}});
}

/* ---------- 入口 ---------- */
function toggleTheme() { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? '' : 'dark'; localStorage.setItem('gill_theme', h.dataset.theme); }
document.documentElement.dataset.theme = localStorage.getItem('gill_theme') || '';
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') sendOrStop();
  if (e.ctrlKey && e.key === '`') $('#term').classList.toggle('on');
  if (e.key === 'Enter' && !e.shiftKey && document.activeElement?.id === 'input') { e.preventDefault(); sendOrStop(); }
});
// xterm 终端（FR：真终端面板；CDN 失败自动降级）
let xterm = null;
function initTerm() {
  const el = $('#term');
  if (typeof Terminal === 'undefined') return;   // CDN 不可用 → 保持纯文本
  xterm = new Terminal({fontSize: 12, theme: {background: '#0c0e12', foreground: '#9fe8b5'}, convertEol: true, disableStdin: true});
  const fit = new FitAddon.FitAddon();
  xterm.loadAddon(fit);
  xterm.open(el);
  fit.fit();
  setTimeout(() => fit.fit(), 300);
}
// terminal 事件改写 xterm
const _origHandle = handle;
// 清理重复的 input 元素（构建期容错）
document.querySelectorAll('#input').forEach((el, i, all) => { if (i < all.length - 1) el.remove(); });
async function enter() {
  initTerm();
  $('#login').style.display = 'none'; $('#app').classList.add('on');
  $('#whoami').textContent = USER;
  await loadSessions();
  if (sessions.length) openSession(sessions[0].id); else newSession();
}
if (TOKEN) { api('/auth/me').then(enter).catch(() => { TOKEN=''; }); }
$('#lp').addEventListener('keydown', e => e.key === 'Enter' && doLogin());
</script>
